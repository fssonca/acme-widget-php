services:
  app:
    build:
      context: .
      target: app
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      LOG_CHANNEL: stderr
      CACHE_STORE: array

  # Checks only: docker compose run --rm backend composer test
  backend:
    profiles: [tools]
    build:
      context: .
      target: backend
    command: composer test

  # Checks only: docker compose run --rm frontend npm test
  frontend:
    profiles: [tools]
    build:
      context: .
      target: frontend
    command: npm test
