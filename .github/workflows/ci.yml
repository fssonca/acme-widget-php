name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile tools build
      - name: Backend tests and static analysis
        run: |
          docker compose run --rm backend composer test
          docker compose run --rm backend composer lint
      - name: Frontend tests and lint
        run: |
          docker compose run --rm frontend npm test
          docker compose run --rm frontend npm run lint
      - name: App answers a quote
        run: |
          docker compose up --build --detach app
          curl --retry 10 --retry-all-errors --retry-delay 1 --fail --silent --show-error \
            -H 'Content-Type: application/json' -d '{"items":[{"code":"R01","quantity":2}]}' \
            http://localhost:8080/api/basket/quote | grep '"totalCents":5437'
